apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId 'com.manech.manechapp'
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    def room_version = "2.2.6"
    def lifecycle_version = "2.3.1"
    def appcompat_version = "1.2.0"
    def constraintlayout_version = "2.0.4"
    def recyclerview_version = "1.1.0"
    def volley_version = "1.2.0"
    def play_service_map_version="18.1.0"
    def play_service_location_version= "21.0.1"
    def picasso_version="2.8"
    def imageslider_version="1.4.0"
  //  def photoview_version="2.3.0"
    def paging_version = "3.1.1"


    implementation "androidx.paging:paging-runtime:$paging_version"


    implementation "com.android.volley:volley:$volley_version"

    implementation "androidx.recyclerview:recyclerview:$recyclerview_version"
    // For control over item selection of both touch and mouse driven selection
    //implementation "androidx.recyclerview:recyclerview-selection:$recyclerview_version"

    implementation "androidx.appcompat:appcompat:$appcompat_version"
    // For loading and tinting drawables on older versions of the platform
    implementation "androidx.appcompat:appcompat-resources:$appcompat_version"

    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    //implementation 'org.jetbrains:annotations-java5:15.0'

    //ROOM
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    // Saved state module for ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    // Annotation processor
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

    // QRCode generator
    implementation 'com.github.kenglxn.QRGen:android:2.6.0'

    implementation "androidx.security:security-crypto:1.0.0"

    // maps by google
    implementation "com.google.android.gms:play-services-maps:$play_service_map_version"
    implementation "com.google.android.gms:play-services-location:$play_service_location_version"

    //picasso for pictures
    implementation "com.squareup.picasso:picasso:$picasso_version"

    implementation "com.github.smarteist:autoimageslider:$imageslider_version"

  //  implementation "com.github.chrisbanes:PhotoView:$photoview_version"
}
